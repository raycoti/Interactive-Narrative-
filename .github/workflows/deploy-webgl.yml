name: Build WebGL and deploy to Azure

on:
  push:
    branches: [master, unity6-upgrade]
  workflow_dispatch:

concurrency:
  group: deploy-webgl
  cancel-in-progress: true

permissions:
  id-token: write   # Azure login through OIDC
  contents: read

env:
  AZURE_RESOURCE_GROUP: InteractiveNarrative
  AZURE_WEBAPP_NAME: InteractiveNarrative

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The Unity editor image is large; the default runner does not have room for it plus the build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.27f1
          targetPlatform: WebGL
          buildMethod: WebGLBuilder.Build

      # IIS on the Azure app needs web.config to serve Unity's gzip-compressed files.
      - name: Package site
        run: |
          sudo chown -R "$USER" "web game"
          cp deploy/web.config "web game/"
          cd "web game" && zip -qr ../site.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path site.zip \
            --type zip \
            --clean true
